<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting Room (9:16 Vertical)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: transparent !important;
      overflow-x: hidden;
    }

    /* Animated Loading Spinner */
    .spinner-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, #818cf8 40%, #c084fc 70%, transparent 100%);
      animation: spin 1.5s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 2.5s ease-in-out;
    }
    .spinner-ring::after {
      content: '';
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #171331;
      transition: background 2.5s ease-in-out;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Sound Visualizer Animation */
    .bar-anim {
      animation: barPulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes barPulse {
      0% { height: 15%; }
      100% { height: 100%; }
    }

    /* Glowing Core Effect */
    .glow {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.4) 0%, transparent 70%);
      animation: glow-pulse 2s ease-in-out infinite;
      transition: background 2.5s ease-in-out;
    }

    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.5); opacity: 0.2; }
    }

    /* Expanding Pulse Rings */
    .pulse-ring {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(129, 140, 248, 0.3);
      animation: pulse-out 3s ease-out infinite;
      transition: border-color 2.5s ease-in-out;
    }
    .pulse-ring:nth-child(2) {
      animation-delay: 1s;
    }

    @keyframes pulse-out {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    /* Subtext Fading Animation */
    .sub-pulse {
      animation: sub-fade 3s ease-in-out infinite;
    }

    @keyframes sub-fade {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Cursor Trail Ripples */
    .cursor-ripple {
      position: fixed;
      pointer-events: none;
      z-index: 50;
    }

    .ripple-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: ripple-expand 1.2s ease-out forwards;
    }

    @keyframes ripple-expand {
      0% { width: 10px; height: 10px; opacity: 0.8; }
      100% { width: 140px; height: 140px; opacity: 0; }
    }
  </style>
</head>
<body class="w-full flex items-center justify-center min-h-screen p-4 text-white relative bg-transparent">

  <!-- Interactive Background Particles Canvas -->
  <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Main Waiting Room Container (9:16 Vertical Format) -->
  <main class="relative z-10 flex flex-col items-center justify-between h-full max-w-xs sm:max-w-sm w-full aspect-[9/16] min-h-[580px] text-center p-6 bg-slate-900/80 border border-white/10 rounded-3xl backdrop-blur-md shadow-2xl my-auto">
    
    <!-- Top Status Tag -->
    <div class="w-full flex justify-center pt-2">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-950/80 border border-indigo-500/30 text-indigo-300 text-xs tracking-widest font-semibold uppercase shadow-lg">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Waiting for everyone</span>
      </div>
    </div>

    <!-- Center Content Area -->
    <div class="flex flex-col items-center gap-5 my-auto w-full">
      
      <!-- Spinner Animation -->
      <div class="relative flex items-center justify-center my-2">
        <div class="glow"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="spinner-ring"></div>
      </div>

      <!-- Text Header -->
      <div class="flex flex-col items-center px-2">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-indigo-50 mb-2 leading-tight select-none">
          ERNESTO TOMATE
        </h1>
        
        <p class="sub-pulse text-xs sm:text-sm text-indigo-200 font-medium max-w-xs">
          People are still joining, we'll begin soon.
        </p>
      </div>

    </div>

    <!-- Bottom Interactive Control Card -->
    <div class="w-full flex flex-col gap-3 pb-1">
      <div class="grid grid-cols-2 gap-2 text-xs text-indigo-300/80">
        <div class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-950/60 border border-white/10">
          <i data-lucide="users" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span>Joined: <strong id="participant-count" class="text-white font-semibold">12</strong></span>
        </div>
        
        <div class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-950/60 border border-white/10">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span>Elapsed: <strong id="elapsed-time" class="text-white font-semibold">00:00</strong></span>
        </div>
      </div>

      <button id="reaction-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600/60 hover:bg-indigo-600/80 text-white font-medium text-xs transition active:scale-95 cursor-pointer border border-indigo-400/30">
        <i data-lucide="heart" class="w-4 h-4 text-rose-400 fill-rose-400"></i>
        <span>Send Heart</span>
      </button>
    </div>

    <!-- Hidden Audio Controls -->
    <div class="hidden" aria-hidden="true">
      <button id="play-asmr-btn"><i id="play-icon" data-lucide="play"></i></button>
      <p id="track-status"></p>
      <div id="visualizer"></div>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5">
      <select id="asmr-type">
        <option value="meditation" selected>Zen Meditação</option>
      </select>
    </div>

  </main>

  <!-- JavaScript Logic -->
  <script>
    lucide.createIcons();

    // Audio Generator
    let audioCtx = null;
    let isPlaying = false;
    let masterGain = null;
    let soundNodes = [];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        const volEl = document.getElementById('volume-slider');
        masterGain.gain.value = volEl ? parseFloat(volEl.value) : 0.5;
        masterGain.connect(audioCtx.destination);
      }
    }

    function stopASMR() {
      soundNodes.forEach(node => {
        try { node.stop ? node.stop() : node.disconnect(); } catch(e){}
      });
      soundNodes = [];
    }

    function playASMR() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      stopASMR();

      const freqs = [108, 216, 288, 432];
      freqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.value = 0.08 / freqs.length;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        soundNodes.push(osc);
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playASMR();
      } else {
        stopASMR();
      }
    }

    window.addEventListener('load', () => {
      if (!isPlaying) togglePlay();
    });

    ['click', 'touchstart', 'mousemove', 'keydown'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (!isPlaying && audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!isPlaying) {
          togglePlay();
        }
      }, { once: true });
    });

    // Cursor Ripples Effect
    const colors = ['#c084fc', '#818cf8', '#a5b4fc', '#ddd6fe'];
    let lastRippleTime = 0;

    function createCursorRipple(x, y) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const container = document.createElement('div');
      container.className = 'cursor-ripple';
      container.style.left = x + 'px';
      container.style.top = y + 'px';
      
      const ripple = document.createElement('div');
      ripple.className = 'ripple-ring';
      ripple.style.borderColor = color;
      
      container.appendChild(ripple);
      document.body.appendChild(container);
      setTimeout(() => container.remove(), 1200);
    }

    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastRippleTime > 70) {
        createCursorRipple(e.clientX, e.clientY);
        lastRippleTime = now;
      }
    });

    // Timer & Count Simulation
    let secondsElapsed = 0;
    const timeEl = document.getElementById('elapsed-time');
    const countEl = document.getElementById('participant-count');

    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      if (timeEl) timeEl.textContent = `${mins}:${secs}`;
    }, 1000);

    setInterval(() => {
      if (Math.random() > 0.4 && countEl) {
        let current = parseInt(countEl.textContent, 10) || 12;
        countEl.textContent = current + 1;
      }
    }, 6000);

    // Heart Reaction
    const reactionBtn = document.getElementById('reaction-btn');
    if (reactionBtn) {
      reactionBtn.addEventListener('click', () => {
        const rect = reactionBtn.getBoundingClientRect();
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            const offsetX = (Math.random() - 0.5) * 60;
            createCursorRipple(rect.left + rect.width / 2 + offsetX, rect.top + rect.height / 2);
          }, i * 80);
        }
      });
    }

    // Canvas Particles
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.alpha = Math.random() * 0.5 + 0.1;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.2;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < 0) this.y = height;
        if (this.x < 0 || this.x > width) this.x = Math.random() * width;
      }
      draw() {
        ctx.fillStyle = `rgba(192, 132, 252, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 30; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
